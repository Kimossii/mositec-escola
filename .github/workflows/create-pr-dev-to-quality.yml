name: Criar PR da development para quality automaticamente

on:
  push:
    branches:
      - development

jobs:
  criar-a-pr-development-para-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Checar diferenças entre development e quality
        id: diff
        run: |
          git fetch origin quality
          if git diff --quiet origin/quality..HEAD; then
            echo "SEM_ALTERACOES=true" >> $GITHUB_ENV
          else
            echo "SEM_ALTERACOES=false" >> $GITHUB_ENV
          fi

      - name: Criar Pull Request
        if: env.SEM_ALTERACOES == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: quality
          branch: auto-pr-development-to-quality
          title: "Sincronizar: development → quality"
          body: |
            PR automático criado a partir de mudanças na development.

            ✔ Revisar antes de fazer merge
