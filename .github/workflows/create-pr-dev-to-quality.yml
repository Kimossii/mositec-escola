name: sincronização development → quality automaticamente

on:
  push:
    branches:
      - development

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se já existe PR aberto
        id: check_pr
        run: |
          PR=$(gh pr list --base quality --head development --state open --json number -q '.[0].number')

          if [ -z "$PR" ]; then
            echo "EXISTE_PR=false" >> $GITHUB_ENV
          else
            echo "EXISTE_PR=true" >> $GITHUB_ENV
            echo "PR_NUMBER=$PR" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar PR se não existir
        if: env.EXISTE_PR == 'false'
        run: |
          gh pr create \
            --base quality \
            --head development \
            --title "Sync: development → quality" \
            --body "PR automático criado a partir da branch development"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Obter número do PR
        if: env.EXISTE_PR == 'false'
        run: |
          PR=$(gh pr list --base quality --head development --state open --json number -q '.[0].number')
          echo "PR_NUMBER=$PR" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge PR
        run: |
          gh pr merge $PR_NUMBER --merge --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
