name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - quality
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Advisories em dependências PHP directas ou transitivas — falha o
      # build sem bloquear em avisos já conhecidos e aceites (--ignore).
      - name: Auditar dependências PHP (composer)
        run: composer audit --no-dev

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-progress

      - name: Instalar dependências JS
        run: npm ci

      # Só as dependências de produção — devDependencies (build tooling)
      # não chegam ao browser do utilizador final.
      - name: Auditar dependências JS (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Compilar assets
        run: npm run build

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Correr a suíte de testes
        run: php artisan test
