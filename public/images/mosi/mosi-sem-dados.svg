<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 320" role="img" aria-label="Ainda não há nada aqui"><title>Sem dados</title><style>.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:br 3s ease-in-out infinite}.mouth{transform-box:fill-box;transform-origin:50% 50%;animation:snore 3s ease-in-out infinite}.z{animation:z 3s ease-out infinite}.z1{animation-delay:1s}.z2{animation-delay:2s}@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.05)}}@keyframes snore{0%,100%{transform:scale(.6)}50%{transform:scale(1.2)}}@keyframes z{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(40px,-90px) scale(1.3)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><ellipse cx="135" cy="302" rx="80" ry="6" fill="#0F172A" opacity=".12"/><g transform="translate(30 90)"><g class="breathe"><path d="M72 186v12M138 186v12" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/><ellipse cx="68" cy="201" rx="18" ry="8" fill="#22C55E"/><ellipse cx="142" cy="201" rx="18" ry="8" fill="#22C55E"/><path class="ribbon" d="M100 186h10v20l-5-5l-5 5z" fill="#22C55E"/><path d="M16 112C6 122 2 134 2 146" stroke="#1E293B" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="2" cy="152" r="9" fill="#1E293B"/><path d="M194 112C204 122 208 134 208 146" stroke="#1E293B" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="208" cy="152" r="9" fill="#1E293B"/><path d="M20 38L105 96L190 38L190 178L105 192L20 178Z" fill="#1E293B" stroke="#1E293B" stroke-width="12" stroke-linejoin="round"/><path d="M30 46L103 98L103 184L30 172Z" fill="#CBD5E1"/><path d="M180 46L107 98L107 184L180 172Z" fill="#CBD5E1"/><path d="M30 40L103 92L103 176L30 164Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/><path d="M180 40L107 92L107 176L180 164Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/><path d="M105 94V180" stroke="#CBD5E1" stroke-wid